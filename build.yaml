overview: "Link your Jellyfin users to JellySeerr"
description: >
  Integrates Jellyfin with JellySeerr to enhance the media request experience.
  Features include prompting users to add their email address for request notifications,
  and allowing users to submit deletion requests for media they originally requested.
category: "Notifications"
owner: "DylanS97"
artifacts:
- "Jellyfin.Plugin.JellyseerrIntegration.dll"
changelog: >
  - Added JellySeerr search integration: movies and TV shows from JellySeerr now appear in
  Jellyfin search results with a Request button to submit requests without leaving Jellyfin.
  - Search results now show poster image, full release/air date, and media type for each item.
  - Fixed live search by attaching to the searchTextInput input event directly instead of
  polling the URL; results now update as you type without needing a page reload.
  - Fixed results not appearing when Jellyfin has no matches by appending into the stable
  searchPage element rather than looking for a results container that may not exist.
  - Fixed live search: replaced hashchange listener with URL polling so results update as
  you type without needing a page reload.
  - Fixed results not showing when Jellyfin itself has no matches by targeting the
  noItemsMessage element as a fallback insertion point.
  - Fixed race condition where results were discarded before the DOM insertion point was ready.
  - Fixed titles showing as Unknown by correctly reading PascalCase JSON property names.

