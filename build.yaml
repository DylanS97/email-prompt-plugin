overview: "Link your Jellyfin users to JellySeerr"
description: >
  Integrates Jellyfin with JellySeerr to enhance the media request experience.
  Features include prompting users to add their email address for request notifications,
  and allowing users to submit deletion requests for media they originally requested.
category: "Notifications"
owner: "DylanS97"
artifacts:
- "Jellyfin.Plugin.JellyseerrIntegration.dll"
changelog: >
  - Added "Request Deletion" button on movie and TV show detail pages for users who originally
  requested the media via JellySeerr. Clicking the button sends a webhook notification to a
  configurable external URL with the user's name, email, and a deletion request message.
  Button is only shown when the user has an email address set in JellySeerr.
  - Added Delete Request Webhook URL setting in the plugin configuration page.

